[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qscout"
version = "0.1.0"
description = "Q-Scout: calibration-drift forecasting, calibrated uncertainty and trust scoring for quantum hardware"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=14",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "lightgbm>=4.0",
  "pyyaml>=6",
  "joblib>=1.3",
  "plotly>=5.18",
  "streamlit>=1.50",
]

[project.optional-dependencies]
ibm = ["qiskit>=1.2", "qiskit-ibm-runtime>=0.30"]
drift = ["ruptures>=1.1"]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.5", "qiskit>=1.2", "qiskit-ibm-runtime>=0.30", "ruptures>=1.1"]

[project.scripts]
qscout = "qscout.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "dashboard"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501", "B008"]
